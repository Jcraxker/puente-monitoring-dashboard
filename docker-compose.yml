services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-puente}
      POSTGRES_USER: ${POSTGRES_USER:-puente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configura POSTGRES_PASSWORD en backend/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puente}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-puente}:${POSTGRES_PASSWORD:?configura POSTGRES_PASSWORD en backend/.env}@db:5432/${POSTGRES_DB:-puente}
      BACKEND_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
